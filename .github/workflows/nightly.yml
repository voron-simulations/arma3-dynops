name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions: {}

jobs:
  check:
    name: Pre-check
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - run: gh run list --limit 1 --workflow nightly.yml --json headSha --template "{{range .}}SHA={{.headSha}}{{end}}" --status completed --repo ${{ github.repository }} >> "$GITHUB_OUTPUT"
      id: last_run
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Print
      run: |
        echo Last sha: ${{ steps.last_run.outputs.sha }}
        echo Current:  ${{ github.sha }}
        echo Should cancel: ${{ steps.last_run.outputs.sha == github.sha }}
        echo ${{ github.workflow_ref }}
        echo ${{ github.action_path }}

    - if: ${{ steps.last_run.outputs.sha == github.sha }}
      run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
      env:
        GH_TOKEN: ${{ github.token }}

  build:
    name: Build
    needs: [check]
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read

  virustotal:
    needs: [build]
    name: VirusTotal Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Download Windows x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-x64-windows
          path: .
  
      - name: Download Linux x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-x64-linux
          path: .
          
      - name: VirusTotal Scan
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_APIKEY }}
          request_rate: 4
          files: |
            ./dynops_x64.dll
            ./dynops_x64.so

  publish:
    needs: [build, virustotal]
    name: Publish nightly release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - name: Download addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: addon
          path: .

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create nightly --repo "${{ github.repository }}" --prerelease --target "${{ github.sha }}" \
            --title "Nightly $(date -u +%Y-%m-%d)" --notes "Automated nightly build of the DynamicOperations extension and addon." \
            dynops-latest.zip
